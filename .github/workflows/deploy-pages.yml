name: Publish catalog to Pages
# Deploys whatever is currently in data/ + mcp_server/site_index.html to
# GitHub Pages. Triggered on any push to main that touches those files, so
# locally-built or manually-edited catalogs go live without re-scraping.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'build_pages.py'
      - '.github/workflows/deploy-pages.yml'
      - 'mcp_server/site_index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site from the catalog
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: python build_pages.py --owner "$REPO_OWNER" --repo "$REPO_NAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
