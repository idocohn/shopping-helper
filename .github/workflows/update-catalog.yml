name: Update catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh catalog and retain data from unavailable sources
        run: python build_catalog.py --outdir data --preserve-existing
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp_server --omit=optional
      - name: Build static site from the catalog
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: python build_pages.py --owner "$REPO_OWNER" --repo "$REPO_NAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Commit refreshed data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update catalog (auto)
          file_pattern: data/products.json data/products.csv data/catalog.sqlite data/categories.json

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
